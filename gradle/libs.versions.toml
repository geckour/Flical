[versions]
# Build tooling
agp = "9.3.2"
kotlin = "2.4.10"
googleServices = "4.5.0"
firebaseCrashlyticsPlugin = "3.0.8"

# Android SDK
compileSdk = "37"
minSdk = "26"
targetSdk = "37"

# Libraries
androidCore = "1.19.0"
activityCompose = "1.13.0"
appcompat = "1.8.0"
bigMath = "2.3.2"
coil = "2.7.0"
compose = "1.12.0"
constraintlayout = "2.2.2"
coroutines = "1.11.0"
espresso = "3.7.0"
exifinterface = "1.4.2"
firebaseBom = "34.18.0"
junit = "4.13.2"
lifecycle = "2.11.0"
material = "1.14.0"
mockk = "1.14.11"
navigationCompose = "2.10.0"
permissionsdispatcher = "1.1.4"
preference = "1.2.1"
testRunner = "1.7.0"
timber = "5.0.1"
truth = "1.4.5"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidCore" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "preference" }

androidx-compose-material = { module = "androidx.compose.material:material", version.ref = "compose" }
androidx-compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "compose" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }

firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }

android-material = { module = "com.google.android.material:material", version.ref = "material" }
bigmath = { module = "ch.obermuhlner:big-math", version.ref = "bigMath" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
permissionsdispatcher-ktx = { module = "com.github.permissions-dispatcher:ktx", version.ref = "permissionsdispatcher" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "testRunner" }
junit = { module = "junit:junit", version.ref = "junit" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }

[bundles]
compose = [
    "androidx-activity-compose",
    "androidx-compose-material",
    "androidx-compose-ui",
    "androidx-compose-ui-tooling",
    "androidx-navigation-compose",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlyticsPlugin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
